services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      MARMOT_DATABASE_HOST: postgres
      MARMOT_DATABASE_PORT: 5432
      MARMOT_DATABASE_USER: marmot
      MARMOT_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-marmot}
      MARMOT_DATABASE_NAME: marmot
      MARMOT_DATABASE_SSLMODE: disable
      MARMOT_TRINO_HOST: trino
      MARMOT_TRINO_PORT: 8080
      MARMOT_TRINO_USER: ${TRINO_USER:-marmot}
      MARMOT_TRINO_HTTP_SCHEME: http
      MARMOT_DEBUG: ${MARMOT_DEBUG:-false}
    depends_on:
      postgres:
        condition: service_healthy
      trino:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: marmot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marmot}
      POSTGRES_DB: marmot
    ports:
      - "5432:5432"
    volumes:
      - marmot_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marmot -d marmot"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Create the Hive Metastore database in the existing Postgres (safe on every boot).
  postgres-init-metastore:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-marmot}
    entrypoint: >
      /bin/sh -c "
      psql -h postgres -U marmot -d marmot -v ON_ERROR_STOP=1 -tc \"SELECT 1 FROM pg_database WHERE datname = 'metastore'\" | grep -q 1
      || psql -h postgres -U marmot -d marmot -v ON_ERROR_STOP=1 -c 'CREATE DATABASE metastore;'
      echo 'metastore database ready'
      "
    restart: "on-failure"

  # --- Lakehouse: MinIO (S3) + Hive Metastore + Trino ---

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/warehouse;
      mc anonymous set download local/warehouse;
      echo 'MinIO warehouse bucket ready';
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123}
    restart: "on-failure"

  hive-metastore:
    image: bitsondatadev/hive-metastore:latest
    ports:
      - "9083:9083"
    volumes:
      # :z is required on Fedora/SELinux so the container can read the bind mounts
      - ./docker/hive/metastore-site.xml:/opt/apache-hive-metastore-3.0.0-bin/conf/metastore-site.xml:ro,z
      - ./docker/hive/core-site.xml:/opt/hadoop-3.2.0/etc/hadoop/core-site.xml:ro,z
      - ./docker/hive/lib/postgresql-42.7.4.jar:/opt/apache-hive-metastore-3.0.0-bin/lib/postgresql-42.7.4.jar:ro,z
      - ./docker/hive/entrypoint.sh:/entrypoint.sh:ro,z
    environment:
      METASTORE_DB_HOSTNAME: postgres
      METASTORE_DB_PORT: 5432
      METASTORE_TYPE: postgres
      HADOOP_CONF_DIR: /opt/hadoop-3.2.0/etc/hadoop
      # Ensure Hive picks up the mounted Postgres JDBC driver
      HIVE_AUX_JARS_PATH: /opt/apache-hive-metastore-3.0.0-bin/lib/postgresql-42.7.4.jar
    depends_on:
      postgres-init-metastore:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "nc -z -w 2 127.0.0.1 9083"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  trino:
    image: trinodb/trino:470
    ports:
      - "8081:8080"
    volumes:
      # :z is required on Fedora/SELinux so the container can read the bind mounts
      - ./docker/trino:/etc/trino:ro,z
    depends_on:
      hive-metastore:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/v1/info"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  marmot_data:
  minio_data:
